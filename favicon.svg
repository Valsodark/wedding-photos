<!-- viewBox is cropped to the artwork, not the 32-unit grid it was drawn on:
     the leftover margin made the rings shrink to a smudge in a browser tab. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.4 2.2 28.4 28.4" role="img" aria-label="Венчални халки">
  <!-- Two bands in the page's own colours. Strokes are deliberately heavy:
       a thin ring turns to mush at 16px in a browser tab. -->
  <circle cx="20.5" cy="13.5" r="7.4" fill="none" stroke="#a35510" stroke-width="2.6"/>
  <circle cx="11.5" cy="18.5" r="8" fill="none" stroke="#2340c4" stroke-width="2.9"/>
</svg>
